name: Test

on:
  pull_request:
    branches: [ "main" ]
    paths-ignore:
      - README.md
  push:
    branches: [ "main" ]
    paths-ignore:
      - README.md
  workflow_dispatch:

concurrency:
  group: format-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:  
    name: Test
    strategy:
      fail-fast: false    
      matrix:
        os: [macos-26]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # swift-subprocess 1.0 is tested upstream with Swift 6.3+; older SDKs reject its Span-based APIs.
      - name: Select the latest stable Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Show toolchain
        run: swift --version

      - name: Test
        run: swift test
